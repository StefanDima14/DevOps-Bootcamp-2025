trigger: none

variables:
- group: aws-ecr
- name: patchVersion
  value: $[counter('newonewsPatchVersion', 0)]
- name: tag
  value: '1.0.$(patchVersion)'
- name: awsRegion
  value: 'eu-west-1'
- name: repoName
  value: 'neonews'

parameters:
- name: monitoring
  displayName: "Enable monitoring"
  type: boolean
  default: false

resources:
- repo: self

stages:
- stage: Test
  displayName: Run Tests
  condition: eq('${{ parameters.monitoring }}', false)
  jobs:
  - job: UnitTests
    displayName: Run Unit Tests
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
        addToPath: true
    - script: |
        python -m pip install --upgrade pip
        pip install -r "$(Build.SourcesDirectory)/Final Boss/neonews/src/requirements.txt"
        pip install pytest flake8
      displayName: 'Install dependencies'
    - script: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      displayName: 'Run Linting (flake8)'
    - script: |
        export PYTHONPATH=$PYTHONPATH:"$(Build.SourcesDirectory)/Final Boss/neonews/src"
        python -m pytest "$(Build.SourcesDirectory)/Final Boss/neonews/tests/test_app.py"
      displayName: 'Run unit tests'
      env:
        NEWSDATA_API_KEY: 'test-key'
        DYNAMODB_TABLE: 'neonews-demo'
        S3_BUCKET_NAME: 'neonews-bucket-demo-123'
        AWS_REGION: 'eu-west-1'

- stage: Build
  dependsOn: Test
  condition: and(succeeded(), eq('${{ parameters.monitoring }}', false))
  displayName: Build image
  jobs:
  - job: BuildAndPush
    displayName: Build and Push
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Build image
      inputs:
        command: build
        dockerfile: '$(Build.SourcesDirectory)/Final Boss/neonews/Dockerfile'
        repository: $(repoName)
        tags: |
          $(tag)
    - script: |
        sudo apt-get install wget gnupg
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy -y

        trivy image --exit-code 1 --severity CRITICAL $(repoName):$(tag)
      displayName: 'Scan image for vulnerabilities (Trivy)'
    - script: |
        # Login to ECR
        aws ecr get-login-password --region $(awsRegion) | docker login --username AWS --password-stdin $(AWS_ACCOUNT_ID).dkr.ecr.$(awsRegion).amazonaws.com

        # Tag and Push
        docker tag $(repoName):$(tag) $(AWS_ACCOUNT_ID).dkr.ecr.$(awsRegion).amazonaws.com/$(repoName):$(tag)
        docker push $(AWS_ACCOUNT_ID).dkr.ecr.$(awsRegion).amazonaws.com/$(repoName):$(tag)

        echo "Pushed image to ECR: $(AWS_ACCOUNT_ID).dkr.ecr.$(awsRegion).amazonaws.com/$(repoName):$(tag)"
      displayName: 'Push to ECR via AWS CLI'
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_ACCOUNT_ID: $(AWS_ACCOUNT_ID)

- stage: Deploy
  displayName: Deploy to EC2
  dependsOn: Build
  condition: and(succeeded(), eq('${{ parameters.monitoring }}', false))
  jobs:
  - job: Deploy
    displayName: Deploy to EC2
    steps:
    - task: DownloadSecureFile@1
      name: sshKey
      displayName: 'Download SSH Key'
      inputs:
        secureFile: 'nodes-connect'
    - script: |
        # Fix line endings (CRLF -> LF) and ensure trailing newline
        cat $(sshKey.secureFilePath) | tr -d '\r' > fixed_key
        echo "" >> fixed_key
        chmod 400 fixed_key
        ssh -o StrictHostKeyChecking=no -i fixed_key ubuntu@$(EC2_HOST) \
          'sudo apt-get update -y
           sudo apt-get install -y docker.io
           sudo systemctl start docker
           sudo systemctl enable docker
           sudo usermod -aG docker ubuntu
           sudo apt install unzip -y
           if ! aws --version; then
             curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
             unzip -o awscliv2.zip
             sudo ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
           fi
           aws --version'
      displayName: 'Install Prerequisites on EC2'
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_ACCOUNT_ID: $(AWS_ACCOUNT_ID)
        EC2_HOST: $(EC2_HOST)
    - script: |
        cat $(sshKey.secureFilePath) | tr -d '\r' > fixed_key
        echo "" >> fixed_key
        chmod 400 fixed_key
        ssh -o StrictHostKeyChecking=no -i fixed_key ubuntu@$(EC2_HOST) \
          'aws ecr get-login-password --region $(awsRegion) | docker login --username AWS --password-stdin $(AWS_ACCOUNT_ID).dkr.ecr.$(awsRegion).amazonaws.com &&
           docker pull $(AWS_ACCOUNT_ID).dkr.ecr.$(awsRegion).amazonaws.com/$(repoName):$(tag) &&
           docker stop python-app || true &&
           docker rm python-app || true &&
           docker run -d -p 8081:5000 --name python-app \
            --log-driver=awslogs \
            --log-opt awslogs-region=$(awsRegion) \
            --log-opt awslogs-group=/neonews/python-app \
            --log-opt awslogs-create-group=true \
            -e NEWSDATA_API_KEY=$(NEWSDATA_API_KEY) \
            -e AWS_REGION=$(awsRegion) \
            -e DYNAMODB_TABLE=$(DYNAMODB_TABLE) \
            -e S3_BUCKET_NAME=$(S3_BUCKET_NAME) \
            $(AWS_ACCOUNT_ID).dkr.ecr.$(awsRegion).amazonaws.com/$(repoName):$(tag)
          '
      displayName: 'Deploy Docker Container on EC2'
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_ACCOUNT_ID: $(AWS_ACCOUNT_ID)
        NEWSDATA_API_KEY: $(NEWSDATA_API_KEY)
        EC2_HOST: $(EC2_HOST)
        S3_BUCKET_NAME: $(S3_BUCKET_NAME)
        DYNAMODB_TABLE: $(DYNAMODB_TABLE)`

- stage: Monitoring
  displayName: Setup Monitoring
  condition: eq('${{ parameters.monitoring }}', true)
  jobs:
  - job: SetupMonitoring
    displayName: Setup CloudWatch Agent on EC2
    steps:
    - task: DownloadSecureFile@1
      name: sshKey
      displayName: 'Download SSH Key'
      inputs:
        secureFile: 'nodes-connect'
    - script: |
        cat $(sshKey.secureFilePath) | tr -d '\r' > fixed_key
        echo "" >> fixed_key
        chmod 400 fixed_key

        ssh -o StrictHostKeyChecking=no -i fixed_key ubuntu@$(EC2_HOST) 'bash -s' << 'ENDSSH'
        set -e

        # Install CloudWatch Agent
        wget -q https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb -O amazon-cloudwatch-agent.deb
        sudo dpkg -i -E ./amazon-cloudwatch-agent.deb

        # Configure Prometheus for CloudWatch
        sudo mkdir -p /opt/aws/amazon-cloudwatch-agent/etc/
        sudo tee /opt/aws/amazon-cloudwatch-agent/etc/prometheus.yaml > /dev/null <<EOF
        global:
          scrape_interval: 1m
          scrape_timeout: 10s
        scrape_configs:
          - job_name: 'cadvisor'
            static_configs:
              - targets: ['localhost:8080']
        EOF

        # Configure CloudWatch Agent
        sudo tee /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json > /dev/null <<EOF
        {
          "logs": {
            "metrics_collected": {
              "prometheus": {
                "log_group_name": "/aws/containerinsights/cadvisor/prometheus",
                "prometheus_config_path": "/opt/aws/amazon-cloudwatch-agent/etc/prometheus.yaml",
                "emf_processor": {
                  "metric_declaration": [
                    {
                      "source_labels": ["job"],
                      "label_matcher": "^cadvisor$",
                      "dimensions": [["name"]],
                      "metric_selectors": [
                        "^container_cpu_usage_seconds_total$",
                        "^container_memory_usage_bytes$",
                        "^container_network_.*_bytes_total$",
                        "^container_fs_.*_bytes_total$"
                      ]
                    }
                  ]
                }
              }
            }
          }
        }
        EOF

        # Start CloudWatch Agent
        sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
          -a fetch-config -m ec2 \
          -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json \
          -s

        echo "CloudWatch Agent configured and started."

        # Setup cAdvisor
        echo "Setting up cAdvisor..."
        sudo docker stop cadvisor || true
        sudo docker rm cadvisor || true

        # Using a stable version of cAdvisor
        VERSION=v0.47.2
        sudo docker run \
          --volume=/:/rootfs:ro \
          --volume=/var/run:/var/run:ro \
          --volume=/sys:/sys:ro \
          --volume=/var/lib/docker/:/var/lib/docker:ro \
          --volume=/dev/disk/:/dev/disk:ro \
          --publish=8080:8080 \
          --detach=true \
          --name=cadvisor \
          --privileged \
          --device=/dev/kmsg \
          gcr.io/cadvisor/cadvisor:$VERSION
        ENDSSH
      displayName: 'Install and Configure CloudWatch Agent and cAdvisor on EC2'
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_ACCOUNT_ID: $(AWS_ACCOUNT_ID)
        EC2_HOST: $(EC2_HOST)
        NEWSDATA_API_KEY: $(NEWSDATA_API_KEY)
        S3_BUCKET_NAME: $(S3_BUCKET_NAME)
        DYNAMODB_TABLE: $(DYNAMODB_TABLE)
