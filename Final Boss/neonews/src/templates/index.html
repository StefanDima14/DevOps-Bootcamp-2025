{% extends 'base.html' %}

{% block content %}
<div class="card shadow">
    <div class="card-header bg-primary text-white">
        Search & Archive News
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="country" class="form-label">Country Name</label>
                <input type="text" class="form-control" id="country" name="country" placeholder="e.g. United States, Japan, Brazil" required>
            </div>
            <div class="mb-3">
                <label for="topic" class="form-label">Topic</label>
                <input type="text" class="form-control" id="topic" name="topic" placeholder="e.g. technology, sports, business" required>
            </div>
            <div class="mb-3">
                <label for="language" class="form-label">Language Code</label>
                <input type="text" class="form-control" id="language" name="language" value="en" placeholder="en">
            </div>
            <button type="submit" class="btn btn-primary w-100">Fetch News</button>
        </form>
    </div>
</div>
<div class="card shadow mt-4">
    <div class="card-header bg-danger text-white">
        Admin Actions
    </div>
    <div class="card-body">
        <div class="d-grid gap-2">
            <form action="{{ url_for('clear_s3') }}" method="POST" onsubmit="return confirm('Are you sure you want to clear the S3 bucket?');">
                <button type="submit" class="btn btn-warning w-100">Clear S3 Bucket</button>
            </form>
            <form action="{{ url_for('clear_dynamodb') }}" method="POST" onsubmit="return confirm('Are you sure you want to clear the DynamoDB table?');">
                <button type="submit" class="btn btn-danger w-100">Clear DynamoDB Table</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
