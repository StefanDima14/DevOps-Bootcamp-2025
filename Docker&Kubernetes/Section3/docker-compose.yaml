services:
  redis:
    image: redis:latest
    container_name: redis-container
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
  app:
    image: compose-image:latest
    container_name: compose-container
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:5000"