---
# Source: my-2tier-app/templates/backend.yaml
apiVersion: v1
kind: Service
metadata:
  name: my-2tier-app-backend-service
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
# Source: my-2tier-app/templates/frontend.yaml
apiVersion: v1
kind: Service
metadata:
  name: my-2tier-app-frontend-service
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: frontend
---
# Source: my-2tier-app/templates/backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-2tier-app-backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 250m
              memory: 128Mi
---
# Source: my-2tier-app/templates/frontend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-2tier-app-frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: stefandima1407/docker-learning:1.0.0
          env:
            - name: REDIS_HOST
              value: my-2tier-app-backend-service
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 250m
              memory: 128Mi
