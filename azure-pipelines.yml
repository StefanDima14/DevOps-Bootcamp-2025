# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

parameters:
  - name: executeApply
    displayName: "Execute Terraform Apply"
    type: boolean
    default: false

resources:
- repo: self

variables:
- group: aws-ecr
- name: patchVersion
  value: $[counter('newonewsPatchVersion', 0)]
- name: tag
  value: '1.0.$(patchVersion)'
- name: awsRegion
  value: 'eu-west-1'
- name: repoName
  value: 'neonews'

stages:
- stage: Infrastructure
  displayName: Deploy Infrastructure
  jobs:
  - job: terraform
    displayName: Deploy Infrastructure with Terraform
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: DownloadSecureFile@1
        name: sshKey
        displayName: 'Download SSH Key'
        inputs:
          secureFile: 'nodes-connect.pub'
      - script: |
          sudo apt-get update && sudo apt-get install -y gnupg software-properties-common
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install terraform
          
          cp $(sshKey.secureFilePath) "$(Build.Repository.LocalPath)/Final Boss/neonews/terraform/nodes-connect.pub"
        displayName: 'Install Terraform Manually'

      - script: terraform version
        displayName: 'Check Terraform Version'

      - script: |
          echo "----------------------Initializing Terraform...----------------------"
          terraform init
          echo "----------------------Terraform initialized.----------------------"
        displayName: 'Terraform Init'
        workingDirectory: '$(Build.SourcesDirectory)/Final Boss/neonews/terraform'
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      - script: |
          echo "----------------------Terraform Plan...----------------------"
          terraform plan
        displayName: 'Terraform Plan'
        workingDirectory: '$(Build.SourcesDirectory)/Final Boss/neonews/terraform'
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      - script: |
          echo "----------------------Terraform Apply...----------------------"
          terraform apply -auto-approve
        displayName: 'Terraform Apply'
        workingDirectory: '$(Build.SourcesDirectory)/Final Boss/neonews/terraform'
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        condition: and(succeeded(), eq('${{ parameters.executeApply }}', true))

- stage: Build
  displayName: Build image
  jobs:
  - job: BuildAndPush
    displayName: Build and Push
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Build an image
      inputs:
        command: build
        dockerfile: '$(Build.SourcesDirectory)/Final Boss/neonews/Dockerfile'
        repository: $(repoName)
        tags: |
          $(tag)
    - script: |
        # Login to ECR
        aws ecr get-login-password --region $(awsRegion) | docker login --username AWS --password-stdin $(AWS_ACCOUNT_ID).dkr.ecr.$(awsRegion).amazonaws.com

        # Tag and Push
        docker tag $(repoName):$(tag) $(AWS_ACCOUNT_ID).dkr.ecr.$(awsRegion).amazonaws.com/$(repoName):$(tag)
        docker push $(AWS_ACCOUNT_ID).dkr.ecr.$(awsRegion).amazonaws.com/$(repoName):$(tag)

        echo "Pushed image to ECR: $(AWS_ACCOUNT_ID).dkr.ecr.$(awsRegion).amazonaws.com/$(repoName):$(tag)"
      displayName: 'Push to ECR via AWS CLI'
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_ACCOUNT_ID: $(AWS_ACCOUNT_ID)
